    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    volumes:
    - bridgedata:/app/data
  nginx:
    depends_on:
    - bridge
    environment:
    - OPENID_DISCOVERY_URL=${OPENID_DISCOVERY_URL}
    - ssl=${ssl}
    - sslCertFileType=${sslCertFileType}
    build: .
    image: ${BRIDGENGINX_IMAGE:-<REPO_URL>bridge-nginx:<VERSION>-<HASH_BRIDGE_NGINX>}
    ports:
    - ${HTTP_PORT:-80}:80 #TAG_REMOVE_WHEN_SSL_CUSTOM_HTTPS_PORT
    - ${HTTPS_PORT:-443}:443 #TAG_REMOVE_WHEN_NO_SSL
    volumes:
    - ./ssl:/tmp/ssl:ro
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
