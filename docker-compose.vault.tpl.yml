#vault-version:<VERSION>
#strato-getting-started-min-version:4.2.1
version: "3"
volumes:
  vaultpgdata:
    driver: local
  idpconfig:
      driver: local
services:
  vault-wrapper:
    depends_on:
      pg-init:
        condition: service_completed_successfully
    environment:
    - keyStoreCacheTimeout=${keyStoreCacheTimeout:-60}
    - postgres_host=${postgres_host:-postgres}
    - postgres_password=${postgres_vault_password:?postgres_vault_password is required}
    - postgres_port=5432
    - postgres_user=strato_vault
    - postgres_vault_wrapper_db=${postgres_vault_wrapper_db:-oauth}
    - VAULTWRAPPER_DEBUG=${VAULTWRAPPER_DEBUG}
    build: .
    image: ${VAULTWRAPPER_IMAGE:-<REPO_URL>vault-wrapper:<VERSION>}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
  pg-init:
    image: ${VAULTWRAPPER_IMAGE:-<REPO_URL>vault-wrapper:<VERSION>}
    entrypoint: ["/vault-wrapper/pg-init.sh"]
    environment:
      - postgres_host=${postgres_host:-postgres}
      - postgres_port=5432
      - postgres_admin_password=${postgres_password:?postgres_password is required}
      - postgres_vault_password=${postgres_vault_password:?postgres_vault_password is required}
      - postgres_vault_wrapper_db=${postgres_vault_wrapper_db:-oauth}
    depends_on:
      - postgres
    restart: "no"
  postgres:
    environment:
      - POSTGRES_PASSWORD=${postgres_password:?postgres_password is required}
    image: postgres:9.6
    volumes:
      - vaultpgdata:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=512MB"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
  nginx:
    depends_on:
    - vault-wrapper
    environment:
    - INITIAL_OAUTH_DISCOVERY_URL=${INITIAL_OAUTH_DISCOVERY_URL}
    - INITIAL_OAUTH_ISSUER=${INITIAL_OAUTH_ISSUER}
    - INITIAL_OAUTH_JWT_USER_ID_CLAIM=${INITIAL_OAUTH_JWT_USER_ID_CLAIM}
    - ssl=${ssl}
    - sslCertFileType=${sslCertFileType}
    - VAULT_WRAPPER_HOST=${VAULT_WRAPPER_HOST}
    build: .
    image: ${VAULTNGINX_IMAGE:-<REPO_URL>vault-nginx:<VERSION>}
    ports:
    - ${HTTP_PORT:-8090}:80 #TAG_REMOVE_WHEN_SSL_CUSTOM_HTTPS_PORT
    - ${HTTPS_PORT:-8093}:443 #TAG_REMOVE_WHEN_NO_SSL
    volumes:
    - ./ssl:/tmp/ssl:ro
    - idpconfig:/config
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
