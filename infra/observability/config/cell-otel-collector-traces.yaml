# ADOT collector on a core cell, traces-only variant (no Managed Prometheus
# deployed): OTLP spans from the node's processes and containers, at
# OTEL_EXPORTER_OTLP_ENDPOINT = http://127.0.0.1:4318, go to X-Ray with the
# instance role. Installed from SSM /strato/__ENV__/observability/otel-collector-cell.
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 127.0.0.1:4317 }
      http: { endpoint: 127.0.0.1:4318 }

processors:
  batch:
    timeout: 10s
  resourcedetection:
    detectors: [env, ec2]
  resource:
    attributes:
      - key: env
        value: __ENV__
        action: upsert

exporters:
  awsxray:
    region: __REGION__

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resourcedetection, resource, batch]
      exporters: [awsxray]
