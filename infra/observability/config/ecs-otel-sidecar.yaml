# ADOT sidecar on an API, app or history task: scrapes the task's own
# containers over the shared network namespace, forwards OTLP traces to
# X-Ray, and remote-writes metrics to Managed Prometheus with the task role.
# Installed from SSM /strato/__ENV__/observability/otel-collector-ecs.
extensions:
  sigv4auth:
    region: __REGION__
    service: aps

receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }
  prometheus:
    config:
      global:
        scrape_interval: 15s
        external_labels:
          env: __ENV__
      scrape_configs:
        - job_name: core-api
          static_configs: [{ targets: ["localhost:3000"] }]
        - job_name: nginx
          static_configs: [{ targets: ["localhost:80"] }]
        - job_name: app-backend
          metrics_path: /api/v1/metrics
          static_configs: [{ targets: ["localhost:3001"] }]
        - job_name: history
          metrics_path: /history-api/metrics
          static_configs: [{ targets: ["localhost:3030"] }]
  awsecscontainermetrics:
    collection_interval: 20s

processors:
  batch:
    timeout: 10s
  resourcedetection:
    detectors: [env, ecs]
  resource:
    attributes:
      - key: env
        value: __ENV__
        action: upsert
  filter/ecs:
    metrics:
      include:
        match_type: strict
        metric_names:
          - ecs.task.memory.utilized
          - ecs.task.memory.reserved
          - ecs.task.cpu.utilized
          - ecs.task.cpu.reserved
          - ecs.task.network.rate.rx
          - ecs.task.network.rate.tx

exporters:
  prometheusremotewrite:
    endpoint: __REMOTE_WRITE_URL__
    auth:
      authenticator: sigv4auth
    resource_to_telemetry_conversion:
      enabled: true
  awsxray:
    region: __REGION__

service:
  extensions: [sigv4auth]
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [resourcedetection, resource, batch]
      exporters: [prometheusremotewrite]
    metrics/ecs:
      receivers: [awsecscontainermetrics]
      processors: [filter/ecs, resource, batch]
      exporters: [prometheusremotewrite]
    traces:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [awsxray]
