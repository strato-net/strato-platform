# Managed Prometheus rule groups for one STRATO environment. Every rule
# carries severity=page or severity=warning; the alertmanager routes on it.
# Metric sources: strato-indexer (Blockchain.ChainMetrics), vm-runner,
# sequencer, p2p, discovery, ingest, slipstream, nginx (lua-prometheus).
groups:
  - name: chain-health
    interval: 15s
    rules:
      # Recording rules the boards and alerts share
      - record: strato:block_age_seconds
        expr: time() - strato_best_block_timestamp_seconds
      - record: strato:sequenced_ahead_of_executed
        expr: strato_best_sequenced_block_number - strato_best_block_number
      - record: strato:behind_world_blocks
        expr: strato_world_best_block_number - strato_best_block_number
      - record: strato:cirrus_lag_blocks
        expr: strato_best_block_number - strato_cirrus_tip_block_number
      - record: strato:indexer_lag_blocks
        expr: strato_best_block_number - strato_indexer_progress_block_number

      - alert: BlockAgeHigh
        expr: strato:block_age_seconds > 30
        for: 1m
        labels: { severity: page, env: __ENV__ }
        annotations:
          summary: "No new block for {{ $value | humanizeDuration }} on {{ $labels.instance }}"
          description: "The chain stopped producing or this cell stopped executing. Check the sequencer round and vm-runner before restarting anything: a static round is not a stall."

      - alert: SequencerAheadOfExecution
        expr: strato:sequenced_ahead_of_executed > 50
        for: 2m
        labels: { severity: page, env: __ENV__ }
        annotations:
          summary: "vm-runner is {{ $value }} blocks behind the sequencer on {{ $labels.instance }}"

      - alert: BehindWorld
        expr: strato:behind_world_blocks > 10
        for: 5m
        labels: { severity: warning, env: __ENV__ }
        annotations:
          summary: "{{ $labels.instance }} is {{ $value }} blocks behind its peers"

      - alert: IndexerLag
        expr: strato:indexer_lag_blocks > 20
        for: 5m
        labels: { severity: page, env: __ENV__ }
        annotations:
          summary: "eth tables are {{ $value }} blocks behind the chain (API tier serves stale data)"

      - alert: CirrusLag
        expr: strato:cirrus_lag_blocks > 20
        for: 5m
        labels: { severity: warning, env: __ENV__ }
        annotations:
          summary: "Cirrus is {{ $value }} blocks behind the chain on {{ $labels.instance }}"

      - alert: CirrusLagSevere
        expr: strato:cirrus_lag_blocks > 200
        for: 5m
        labels: { severity: page, env: __ENV__ }
        annotations:
          summary: "Cirrus is {{ $value }} blocks behind the chain: app data is stale"

      - alert: WriterLeaseNotHeldByExactlyOne
        expr: sum(strato_writer_lease_held) != 1
        for: 2m
        labels: { severity: page, env: __ENV__ }
        annotations:
          summary: "{{ $value }} cells hold the writer lease (expected exactly 1)"
          description: "0 means no core is indexing the shared cluster: promote a standby with strato-promote. 2 means two cores believe they write: stop one immediately."

      - alert: ProcessDown
        expr: up{job=~"strato-.*|vm-runner|slipstream|ethereum-discover|core-api"} == 0
        for: 2m
        labels: { severity: page, env: __ENV__ }
        annotations:
          summary: "{{ $labels.job }} on {{ $labels.instance }} is not answering its metrics endpoint"

      - alert: InvalidBlocksSeen
        expr: rate(vm_blocks_invalid[5m]) > 0
        for: 5m
        labels: { severity: warning, env: __ENV__ }
        annotations:
          summary: "vm-runner on {{ $labels.instance }} is rejecting proposed blocks"
          description: "A sustained rejection rate with a static round is the receipt-drop pattern from the 2026-08-24 halt."

      - alert: FewPeers
        expr: disc_num_peers < 2
        for: 10m
        labels: { severity: warning, env: __ENV__ }
        annotations:
          summary: "{{ $labels.instance }} has {{ $value }} peers"

      - alert: IngestDroppingEvents
        expr: rate(strato_ingest_dropped_total[5m]) > 0
        for: 5m
        labels: { severity: warning, env: __ENV__ }
        annotations:
          summary: "strato-ingest on {{ $labels.instance }} is dropping non-transaction events from the bus"

      - alert: VmRunnerHeapHigh
        expr: strato_rts_live_bytes{name="vm-runner"} > 12e9
        for: 10m
        labels: { severity: warning, env: __ENV__ }
        annotations:
          summary: "vm-runner live heap is {{ $value | humanize1024 }}B on {{ $labels.instance }}"

  - name: edge-health
    interval: 30s
    rules:
      - alert: Edge5xxRatioHigh
        expr: |
          sum by (instance) (rate(nginx_http_requests_total{status=~"5.."}[5m]))
            / sum by (instance) (rate(nginx_http_requests_total[5m])) > 0.01
        for: 5m
        labels: { severity: page, env: __ENV__ }
        annotations:
          summary: "nginx on {{ $labels.instance }} is returning over 1 percent 5xx"

      - alert: CsrfRejections
        expr: sum by (instance) (rate(nginx_http_requests_total{status="403"}[15m])) > 0.5
        for: 15m
        labels: { severity: warning, env: __ENV__ }
        annotations:
          summary: "Sustained 403s on {{ $labels.instance }}: CSRF or session trouble on the edge"

      - alert: EdgeLatencyHigh
        expr: |
          histogram_quantile(0.95, sum by (le, instance) (rate(nginx_http_request_duration_seconds_bucket[5m]))) > 2
        for: 10m
        labels: { severity: warning, env: __ENV__ }
        annotations:
          summary: "p95 request latency over 2 s on {{ $labels.instance }}"
