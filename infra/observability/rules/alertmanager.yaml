# Managed Prometheus alertmanager: pages and warnings go to their SNS topics,
# which PagerDuty and Slack subscribe to. Placeholders are filled by CDK.
alertmanager_config: |
  route:
    receiver: warnings
    group_by: [alertname, env, instance]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: pages
        matchers:
          - severity = page
        repeat_interval: 1h
  receivers:
    - name: pages
      sns_configs:
        - topic_arn: __PAGES_TOPIC_ARN__
          sigv4:
            region: __REGION__
          subject: "[PAGE] {{ .GroupLabels.alertname }} ({{ .GroupLabels.env }})"
          message: |
            {{ range .Alerts }}{{ .Annotations.summary }}
            {{ .Annotations.description }}
            {{ end }}
    - name: warnings
      sns_configs:
        - topic_arn: __WARNINGS_TOPIC_ARN__
          sigv4:
            region: __REGION__
          subject: "[warn] {{ .GroupLabels.alertname }} ({{ .GroupLabels.env }})"
          message: |
            {{ range .Alerts }}{{ .Annotations.summary }}
            {{ end }}
