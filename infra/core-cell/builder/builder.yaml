AWSTemplateFormatVersion: "2010-09-09"
Description: Throwaway Linux builder for the strato and prometheus images - builds from a source tarball in S3, pushes to ECR, and can then be deleted
# The strato image must be built on Linux (Dockerfile.multi copies host-built
# binaries), and this repo's `make strato_docker` builds them on the host. This
# stack is one Ubuntu instance that does exactly that from a source tarball,
# pushes the result to the account's ECR, leaves a RESULT file and the build log
# under the same S3 prefix, and is deleted afterwards:
#
#   aws cloudformation deploy --stack-name strato-builder --template-file builder.yaml \
#     --capabilities CAPABILITY_NAMED_IAM --parameter-overrides SubnetId=... VpcId=... \
#     SourceBucket=... SourcePrefix=builder EcrPrefix=<account>.dkr.ecr.<region>.amazonaws.com/
#   aws s3 cp s3://<bucket>/builder/RESULT -            # image tags when done
#   aws cloudformation delete-stack --stack-name strato-builder
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: A public subnet (the builder needs to reach apt, Hackage and ECR; no inbound access is opened)
  InstanceType:
    Type: String
    Default: c6i.8xlarge
    Description: The stack snapshot compiles from scratch; 32 vCPU keeps that near an hour
  SourceBucket:
    Type: String
  SourcePrefix:
    Type: String
    Default: builder
    Description: The tarball is <prefix>/scaling-src.tgz; the log and RESULT land under the same prefix
  EcrPrefix:
    Type: String
    Description: Registry prefix with a trailing slash; the strato and prometheus repositories must exist under it
  AmiParameter:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
Resources:
  Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPowerUser
      Policies:
        - PolicyName: source-and-results
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub "arn:aws:s3:::${SourceBucket}/${SourcePrefix}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${SourceBucket}"
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref Role]
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: strato builder - egress only, shell through Session Manager
      VpcId: !Ref VpcId
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiParameter
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref SecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      InstanceInitiatedShutdownBehavior: stop
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs: { VolumeSize: 300, VolumeType: gp3, DeleteOnTermination: true }
      MetadataOptions: { HttpTokens: required }
      Tags:
        - { Key: Name, Value: !Ref "AWS::StackName" }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # Everything the builder does, logged to /var/log/strato-build.log and
          # copied to S3 every minute and at the end, with RESULT on success.
          export DEBIAN_FRONTEND=noninteractive HOME=/root
          BUCKET="${SourceBucket}"; PREFIX="${SourcePrefix}"; ECR="${EcrPrefix}"; REGION="${AWS::Region}"
          LOG=/var/log/strato-build.log
          exec > >(tee -a $LOG) 2>&1
          snap install aws-cli --classic
          export AWS_DEFAULT_REGION=$REGION
          ( while true; do sleep 60; aws s3 cp $LOG s3://$BUCKET/$PREFIX/build.log --only-show-errors || true; done ) &
          finish() { echo "== $1 at $(date -u)"; aws s3 cp $LOG s3://$BUCKET/$PREFIX/build.log --only-show-errors || true; echo "$1" | aws s3 cp - s3://$BUCKET/$PREFIX/STATUS; }
          trap 'finish FAILED' ERR
          set -eo pipefail
          echo "== packages at $(date -u)"
          apt-get update -q
          apt-get install -y -q docker.io git build-essential curl unzip jq zstd \
            libgmp-dev zlib1g-dev libpq-dev libleveldb-dev libsecp256k1-dev libsodium-dev liblapack-dev libblas-dev \
            librdkafka-dev libpcre3-dev liblzma-dev pkg-config autoconf libtool libnuma-dev libtinfo-dev libncurses-dev \
            libffi-dev libgmp10 postgresql-client
          systemctl enable --now docker
          curl -sSL https://get.haskellstack.org/ | sh -s - -f
          echo "== source"
          mkdir -p /build && cd /build
          aws s3 cp s3://$BUCKET/$PREFIX/scaling-src.tgz src.tgz --only-show-errors
          mkdir -p scaling && tar -xzf src.tgz -C scaling
          # A tarball made on macOS may carry AppleDouble metadata files; Cabal sees ._x.cabal as a second cabal file.
          find scaling -name '._*' -delete
          cd scaling
          # The Makefile hashes tracked files with git; make this tree a repo of its own.
          # A tarball made elsewhere carries its own uids: take ownership and mark the
          # tree safe, or git refuses ("dubious ownership") and the version splice in
          # strato-version fails with "Not in a git repository".
          chown -R root:root /build/scaling
          git config --global --add safe.directory /build/scaling
          git init -q && git config user.email builder@local && git config user.name builder && git add -A && git commit -qm "builder snapshot"
          echo "== build at $(date -u) on $(nproc) cpus"
          # GHC and the snapshot's packages compile from scratch here (the long part).
          # nginx and app-nginx too: the node's generated compose and the tiers name
          # them by the same tracked-file hashes, so they must come from this tree.
          make strato_docker prometheus nginx app-nginx REPO_URL="$ECR" NIX_FLAG=""
          echo "== push at $(date -u)"
          aws ecr get-login-password | docker login --username AWS --password-stdin "${!ECR%%/*}"
          for img in $(docker images --format '{{.Repository}}:{{.Tag}}' | grep "^$ECR" | grep -E "/(strato|prometheus|nginx|app-nginx):"); do docker push "$img"; echo "$img" >> /build/RESULT; done
          aws s3 cp /build/RESULT s3://$BUCKET/$PREFIX/RESULT
          finish DONE
Outputs:
  InstanceId:
    Value: !Ref Instance
  Log:
    Value: !Sub "s3://${SourceBucket}/${SourcePrefix}/build.log"
  Result:
    Value: !Sub "s3://${SourceBucket}/${SourcePrefix}/RESULT"
