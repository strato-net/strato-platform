#bridge-version:<VERSION>
services:
  external-bridge-verifier:
    environment:
    - PORT=3004
    - DESTINATION_CHAIN_ID=${DESTINATION_CHAIN_ID}
    - DESTINATION_VAULT_ADDRESS=${DESTINATION_VAULT_ADDRESS}
    - VERIFIER_RPC_URL=${VERIFIER_RPC_URL}
    - VERIFIER_INDEPENDENT_RPC_URLS=${VERIFIER_INDEPENDENT_RPC_URLS}
    - SOURCE_CHAIN_ID=${SOURCE_CHAIN_ID}
    - STRATO_NODE_URL=${STRATO_NODE_URL}
    - EXTERNAL_ASSET_BRIDGE_ADDRESS=${EXTERNAL_ASSET_BRIDGE_ADDRESS}
    - SETTLEMENT_ATTESTOR_OPENID_DISCOVERY_URL=${SETTLEMENT_ATTESTOR_OPENID_DISCOVERY_URL}
    - SETTLEMENT_ATTESTOR_CLIENT_ID=${SETTLEMENT_ATTESTOR_CLIENT_ID}
    - SETTLEMENT_ATTESTOR_CLIENT_SECRET=${SETTLEMENT_ATTESTOR_CLIENT_SECRET}
    - SETTLEMENT_ATTESTOR_BA_USERNAME=${SETTLEMENT_ATTESTOR_BA_USERNAME}
    - SETTLEMENT_ATTESTOR_BA_PASSWORD=${SETTLEMENT_ATTESTOR_BA_PASSWORD}
    - VAULT_AUTHORIZATION_SIGNER_ADDRESS=${VAULT_AUTHORIZATION_SIGNER_ADDRESS}
    - KMS_KEY_ID=${KMS_KEY_ID}
    - KMS_REGION=${KMS_REGION}
    - STRATO_NATIVE_BRIDGE_ADDRESS=${STRATO_NATIVE_BRIDGE_ADDRESS}
    - NATIVE_REPRESENTATION_BRIDGE_ADDRESS=${NATIVE_REPRESENTATION_BRIDGE_ADDRESS}
    - NATIVE_ATTESTATION_SIGNER_ADDRESS=${NATIVE_ATTESTATION_SIGNER_ADDRESS}
    - NATIVE_KMS_KEY_ID=${NATIVE_KMS_KEY_ID}
    - NATIVE_KMS_REGION=${NATIVE_KMS_REGION}
    - VERIFIER_POLICY_PATH=/run/secrets/eab-verifier-policy.json
    - NATIVE_VERIFIER_POLICY_PATH=${NATIVE_VERIFIER_POLICY_PATH:-}
    - EXTERNAL_BRIDGE_VERIFIER_API_TOKEN=${EXTERNAL_BRIDGE_VERIFIER_API_TOKEN}
    - VERIFIER_CONFIRMATIONS=${VERIFIER_CONFIRMATIONS}
    image: ${BRIDGE_IMAGE:-<REPO_URL>bridge-eab:<VERSION>-<HASH_BRIDGE_EAB>}
    command: ["node", "dist/signer/index.js"]
    init: true
    restart: unless-stopped
    ports:
    - ${SIGNER_PORT:-3004}:3004
    volumes:
    - ${VERIFIER_POLICY_PATH_HOST}:/run/secrets/eab-verifier-policy.json:ro
    - ${NATIVE_VERIFIER_POLICY_PATH_HOST:-/dev/null}:/run/secrets/native-verifier-policy.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --header='Authorization: Bearer $${EXTERNAL_BRIDGE_VERIFIER_API_TOKEN}' -qO- http://localhost:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
