# -----------------------------------------------------------------------------
# STRATO Load Test Config — high-level (application-layer) scenarios
# -----------------------------------------------------------------------------
# This config wires up the four "high-level" scenarios that exercise the full
# Mercata application stack (ui + backend + STRATO + bridge):
#   - tokenSale      (bridge-in + buy-metals composition)
#   - jsonRpcStress  (JSON-RPC proxy load)
#   - fullApp        (multi-step user workflow)
#   - bridgeIn       (Sepolia -> STRATO bridge)
# For low-level direct-node scenarios (contractDeploy / functionCall /
# mixedWorkload) see config.example.yaml instead.
#
# Defaults below target helium (STRATO chainId 114784819836269) but
# nothing here is specific to helium — point the URLs and addresses at any
# other STRATO network and the same scenarios will run.
#
# HOW TO USE THIS FILE
# --------------------
# The single source of truth for every knob's built-in default is in
# src/config.ts (the per-scenario default objects in `loadConfig`). This
# file documents every field — fields matching the code default are
# commented out so you only need to uncomment and edit what you want to
# override. Fields that MUST be supplied for a scenario to start are left
# uncommented with a REPLACE_* placeholder.
#
# Copy to config.highlevel.yaml and fill in the credentials + addresses for
# your environment. Run one scenario at a time via:
#   npm run test:token-sale -- --config config.highlevel.yaml
#   npm run test:rpc        -- --config config.highlevel.yaml
#   npm run test:full-app   -- --config config.highlevel.yaml
#   npm run test:bridge-in  -- --config config.highlevel.yaml
# -----------------------------------------------------------------------------

nodes:
  - name: "helium"
    # Backend URL — /strato and /bloc are proxied through nginx to the STRATO
    # node, so you can point this at the public app URL.
    url: "https://app.testnet.strato.nexus"
    auth:
      # Keycloak OAuth 2.0 confidential client credentials + user. clientId
      # refers to the Keycloak client (application) registered in the mercata
      # realm, NOT the end user.
      openIdDiscoveryUrl: "https://keycloak.blockapps.net/auth/realms/mercata/.well-known/openid-configuration"
      clientId: "REPLACE_CLIENT_ID"           # e.g. "localhost" in dev, or the confidential client for loadtests
      clientSecret: "REPLACE_CLIENT_SECRET"
      username: "REPLACE_LOAD_TEST_USER"
      password: "REPLACE_LOAD_TEST_PASSWORD"

# gas:                       # defaults: { limit: 32100000000, price: 1 }
#   limit: 32100000000
#   price: 1

# polling:                   # defaults: { interval: 2000, timeout: 120000 }
#   interval: 2000
#   timeout: 120000

scenarios:
  # ---------------------------------------------------------------------------
  # Scenario 1 — Token Sale TPS (1000 sales / 30s)
  # ---------------------------------------------------------------------------
  # Replays the "Fund > Bridge-In (Ethereum → STRATO, USDC → GOLDST)" flow
  # performed by mercata/ui/src/components/bridge/BridgeIn.tsx. Each "sale"
  # is the composition of:
  #   1. POST /api/bridge/requestDepositAction   (AUTO_FORGE action)
  #   2. POST /api/metal-forge/buy               (USDST → metal on STRATO)
  # An optional warm-up issues the same GETs the Fund page does on mount
  # (networkConfigs / depositActions / bridgeableTokens / metal-forge/configs).
  #
  # The Ethereum-side Permit2 approve + DepositRouter.deposit are NOT replayed
  # per iteration (they burn real gas / block time). Set externalTxHash to a
  # real Ethereum tx hash to exercise the bridge request, or leave
  # skipBridgeRequest=true (default) to exercise only the buy-metal leg.
  #
  # Each test user must hold enough USDST balance + voucher/USDST gas coverage
  # (0.01 USDST per approve+mint pair).
  tokenSale:
    # REQUIRED — GOLDST (or another metal token) address on STRATO.
    # Discover via `curl $BACKEND/api/metal-forge/configs`.
    metalTokenAddress: "REPLACE_GOLDST_ADDRESS"
    # --- everything below has a code default; uncomment to override ---
    # enabled: false                        # default
    # backendUrl: "https://app.testnet.strato.nexus"   # default: node[0].url
    # networkLabel: "helium"                # default (report metadata only)
    # chainId: 114784819836269              # default (STRATO helium testnet)
    # totalTxCount: 1000                    # default
    # timeWindowMs: 30000                   # default (paces rate to hit totalTxCount over this window)
    # concurrentUsers: 50                   # default (The number of parallel sales to run, spread across the configured user accounts in a round-robin fashion)
    # --- bridge-in phase (POST /api/bridge/requestDepositAction) ---
    # externalChainId: "11155111"           # default Ethereum Sepolia ("1" Ethereum mainnet | "8453" Base | ...)
    # externalTxHash: ""                    # default — STATIC fallback hash (used only when `bridge` is unset)
    # action: 2                             # default (1=AUTO_SAVE lend, 2=AUTO_FORGE metal)
    # --- inline Sepolia broadcaster (Scenario 4 flow merged into Scenario 1) ---
    # When `bridge` is set AND skipBridgeRequest is false, every iteration:
    #   1. Broadcasts a fresh DepositRouter.depositETH on Sepolia (sequential nonce).
    #   2. Posts /api/bridge/requestDepositAction with the resulting hash.
    #   3. Posts /api/metal-forge/buy.
    # All N iterations run in parallel across workers; the broadcaster signs
    # them with nonces startNonce..startNonce+N-1 from a single funded EOA.
    # NOTE: the EOA needs ~N × (amountPerTx + gas) Sepolia ETH funded up-front.
    # bridge:
    #   sepoliaRpcUrl:           "https://sepolia.infura.io/v3/REPLACE_INFURA_KEY"
    #   sepoliaPrivateKey:       "0xREPLACE_FUNDED_PRIVATE_KEY"
    #   depositRouterAddress:    "0xREPLACE_DEPOSIT_ROUTER_ADDRESS_ON_SEPOLIA"
    #   stratoRecipientAddress:  "REPLACE_STRATO_RECIPIENT"          # hex, with or without 0x
    #   targetStratoToken:       "93fb7295859b2d70199e0a4883b7c320cf874e6c"   # helium ETH token (or USDST etc.)
    #   amountPerTx:             "1000000000000"                     # default 0.000001 ETH per bridge-in
    #   chainId:                 11155111                             # default Sepolia
    #   awaitConfirmation:       false                                # default — block on Sepolia receipt per iteration?
    #   gasLimit:                250000                               # default
    #   maxFeePerGasGwei:        30                                   # default
    #   maxPriorityFeePerGasGwei: 2                                   # default
    #   # startNonce: 0                                               # default: read from chain ("pending")
    # --- buy-metal phase (POST /api/metal-forge/buy) ---
    # payTokenAddress: "937efa7e3a77e20bbdbd7c0d32b6514f368c1010"  # default (USDST helium testnet)
    # payAmount: "1000000000000000"         # default (0.001 USDST in 18-dec wei)
    # minMetalOut: "0"                      # default (slippage guard — compute from oracle in prod)
    # --- behaviour toggles ---
    # includePageLoad: true                 # default (4 Fund-page GETs once per user during warmup)
    # skipBridgeRequest: true               # default (set false + supply externalTxHash to include bridge leg)
    # skipBuyMetal: false                   # default
    # --- pipeline mode (decouples broadcast / bridge / buy phases) ---
    # When true the scenario runs in TWO PHASES with bounded concurrency:
    #   Phase 1: broadcast all N Sepolia deposits in parallel (single signer,
    #            sequential nonces; concurrency=sepoliaConcurrency).
    #   Phase 2: for each successful broadcast, fire bridgeRequest+buyMetal
    #            in parallel (concurrency=backendConcurrency).
    # Wall clock collapses to ~max(slowest broadcast)+max(slowest backend rt)
    # instead of the per-worker N×(broadcast+bridge+buy) sequence. timeWindowMs
    # is ignored under pipelineMode — phases run as fast as concurrency allows.
    # pipelineMode: false                   # default
    # sepoliaConcurrency: 50                # default = concurrentUsers
    # backendConcurrency: 50                # default = concurrentUsers
    # --- transient-error retry (bridgeRequest + buyMetal legs) ---
    # Retries on HTTP 429 + any 5xx (e.g. backend 503 when the bridge service
    # is overloaded). Backoff between attempts is exponential with ±0..500 ms
    # jitter — attempt 2 fires after ~1.5s, attempt 3 after ~3s, attempt 4
    # after ~6s. Final post-retry failures still surface as `… FAILED:` lines.
    # requestRetries: 3                     # default; 0 disables retry
    # --- balance logging ---
    # logBalances: "none"                   # default — "none" | "summary" | "perStep"
    #                                       # none:    no balance reads (max throughput, pre-feature behaviour)
    #                                       # summary: one snapshot before + one after the whole run
    #                                       # perStep: snapshot before + after every iteration (adds ~6 GETs/sale)
    # metalForgeAddress: "c5ed981b816a626981a5747d125e0e7296b2c7c6"   # default (helium MetalForge — used for forge-side balance reads)
    # --- optional user pool (cycles across concurrentUsers for more realistic auth load) ---
    # users:
    #   - { username: "loadtest1", password: "pw1" }
    #   - { username: "loadtest2", password: "pw2" }
    # openIdDiscoveryUrl: ""                # default: node[0].auth.openIdDiscoveryUrl
    # clientId: ""                          # default: node[0].auth.clientId
    # clientSecret: ""                      # default: node[0].auth.clientSecret

  # ---------------------------------------------------------------------------
  # Scenario 2 — JSON-RPC stress (300 users)
  # ---------------------------------------------------------------------------
  # Targets https://app.testnet.strato.nexus/rpc/<chainId>. The mercata backend
  # forwards this to the STRATO node's /strato-api/eth/v1.2 JSON-RPC endpoint.
  # Methods known to be implemented by the STRATO node are used by default;
  # eth_getLogs / eth_getTransactionReceipt are deliberately excluded.
  jsonRpcStress:
    # enabled: false                        # default
    # rpcUrl: "https://app.testnet.strato.nexus/rpc/114784819836269"   # default
    # concurrentUsers: 300                  # default
    # durationMs: 60000                     # default
    # thinkTimeMs: 0                        # default
    # authenticated: true                   # default — /rpc/:chainId requires a bearer token
    # methods: []                           # default — uses built-in rotation in src/scenarios/jsonRpcStress.ts
    # methods:
    #   - { method: "eth_blockNumber", weight: 4 }
    #   - { method: "eth_getBalance",  weight: 3, params: ["0x0000000000000000000000000000000000000000", "latest"] }

  # ---------------------------------------------------------------------------
  # Scenario 3 — Full app simulation (300 users)
  # ---------------------------------------------------------------------------
  # Each virtual user walks through a realistic Mercata workflow (home ->
  # browse -> balance -> Fund-page GETs -> purchase -> events). Uses the
  # mercata backend via /api/*.
  fullApp:
    # enabled: false                        # default
    # baseUrl: "https://app.testnet.strato.nexus"   # default
    # concurrentUsers: 300                  # default
    # durationMs: 120000                    # default
    # iterationsPerUser: 3                  # optional cap; default = loop for durationMs
    # workflow: []                          # default — uses built-in workflow in src/scenarios/fullAppSimulation.ts
    # workflow:
    #   - { name: home,       method: GET,  path: "/",                   thinkTimeMs: 300 }
    #   - { name: listTokens, method: GET,  path: "/api/tokens",  auth: true, thinkTimeMs: 400 }
    #   - { name: balance,    method: GET,  path: "/api/tokens/balance", auth: true }
    #   - { name: purchase,   method: POST, path: "/api/metal-forge/buy", auth: true,
    #       body: { metalToken: "{metalTokenAddress}", payToken: "{payTokenAddress}",
    #               payAmount: "{payAmount}", minMetalOut: "{minMetalOut}" } }

  # ---------------------------------------------------------------------------
  # Scenario 4 — Ethereum Sepolia → STRATO bridge-in (50 / 30s)
  # ---------------------------------------------------------------------------
  # Uses ethers.js to broadcast DepositRouter.depositETH transactions from a
  # funded Sepolia EOA. The bridge service (mercata/services/bridge) detects
  # the DepositRouted event and credits the recipient on STRATO.
  #
  # Prerequisites:
  #   - DepositRouter contract deployed on Sepolia (see README for deployment
  #     steps using mercata/ethereum/hardhat). Register its address +
  #     asset mappings in the on-chain MercataBridge contract on STRATO.
  #   - Sepolia RPC URL (Infura/Alchemy/dRPC).
  #   - Funded Sepolia account — fund via faucets.chain.link / sepoliafaucet.com.
  #   - Bridge service running with CHAIN_11155111_RPC_URL pointing at Sepolia.
  bridgeIn:
    # --- REQUIRED for this scenario to start ---
    sepoliaRpcUrl: "https://sepolia.infura.io/v3/REPLACE_INFURA_KEY"
    sepoliaPrivateKey: "0xREPLACE_FUNDED_PRIVATE_KEY"
    depositRouterAddress: "0xREPLACE_DEPOSIT_ROUTER_ADDRESS_ON_SEPOLIA"
    stratoRecipientAddress: "REPLACE_STRATO_RECIPIENT"  # hex, no 0x
    targetStratoToken: "93fb7295859b2d70199e0a4883b7c320cf874e6c"  # helium ETH token — override for other targets
    # --- everything below has a code default ---
    # enabled: false                        # default
    # totalBridgeIns: 50                    # default
    # timeWindowMs: 30000                   # default
    # sepoliaChainId: 11155111              # default
    # depositMode: "ETH"                    # default — "ERC20" requires Permit2 signing (not yet supported)
    # sepoliaTokenAddress: ""               # optional, only used with depositMode="ERC20"
    # amountPerTx: "1000000000000"          # default (0.000001 ETH per bridge-in)
    # stratoBackendUrl: "https://app.testnet.strato.nexus"  # optional — only used for post-bridge verification messaging
    # awaitSepoliaConfirmation: false       # default
    # stratoConfirmTimeoutSec: 180          # default
    # startNonce: 0                         # default: read from chain ("pending")
    # gasLimit: 250000                      # default
    # maxFeePerGasGwei: 30                  # default
    # maxPriorityFeePerGasGwei: 2           # default

  # ---------------------------------------------------------------------------
  # Low-level legacy scenarios — use config.example.yaml for a richer setup.
  # Each defaults to enabled=false, so leaving these commented is fine.
  # ---------------------------------------------------------------------------
  # contractDeploy:
  #   enabled: false
  # functionCall:
  #   enabled: false
  # mixedWorkload:
  #   enabled: false
  # multiNode:
  #   enabled: false

# report:                    # defaults: { outputDir: "./reports", formats: ["json", "html"] }
#   outputDir: "./reports"
#   formats:
#     - json
#     - html
