version: '3.8'
services:
  backend:
    build: ./backend
    image: app-backend:latest
    environment:
      - OAUTH_DISCOVERY_URL=${OAUTH_DISCOVERY_URL}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      - NODE_URL=${NODE_URL}
      - BASE_URL=${BASE_URL}
      - RPC_URL_MAINNET=${RPC_URL_MAINNET}
      - RPC_URL_MAINNET_FALLBACK=${RPC_URL_MAINNET_FALLBACK}
      - RPC_URL_SEPOLIA=${RPC_URL_SEPOLIA}
      - RPC_URL_SEPOLIA_FALLBACK=${RPC_URL_SEPOLIA_FALLBACK}
      - RPC_URL_HYPEREVM=${RPC_URL_HYPEREVM}
      - RPC_URL_HYPEREVM_FALLBACK=${RPC_URL_HYPEREVM_FALLBACK}
      - POOL_FACTORY=${POOL_FACTORY}
      - LENDING_REGISTRY=${LENDING_REGISTRY}
      - TOKEN_FACTORY=${TOKEN_FACTORY}
      - ADMIN_REGISTRY=${ADMIN_REGISTRY}
      - MERCATA_BRIDGE=${MERCATA_BRIDGE}
      - WAGMI_PROJECT_ID=${WAGMI_PROJECT_ID}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
  # App history service (phase 7): prices, swaps and balances over time in
  # its own database, fed by the bus when BUS_HOST is set and by polling the
  # node's Cirrus otherwise. Served by nginx under /history-api.
  history:
    build: ./services/history
    image: history:latest
    environment:
      - NODE_URL=${NODE_URL}
      - postgres_host=${postgres_host:-postgres}
      - postgres_port=${postgres_port:-5432}
      - postgres_user=${postgres_user:-postgres}
      - postgres_password=${postgres_password}
      - HISTORY_DB_NAME=${HISTORY_DB_NAME:-history}
      - BUS_HOST=${BUS_HOST:-}
      - BUS_PORT=${BUS_PORT:-9096}
      - BUS_SECURITY=${BUS_SECURITY:-sasl_ssl}
      - BUS_SASL_USERNAME=${BUS_SASL_USERNAME:-}
      - BUS_SASL_PASSWORD=${BUS_SASL_PASSWORD:-}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
  ui:
    depends_on:
      - backend
    build: ./ui
    image: app-ui:latest
    environment:
      - POSTHOG_KEY=${POSTHOG_KEY}
      - POSTHOG_HOST=${POSTHOG_HOST}
      - GOOGLE_ANALYTICS_ID=${GOOGLE_ANALYTICS_ID}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
  rwa-io-adapter:
    build: ./adapters/rwa-io
    image: app-rwa-io-adapter:latest
    environment:
      - RWA_IO_API_KEY=${RWA_IO_API_KEY}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
  nginx:
    environment:
      - HISTORY_HOST=${HISTORY_HOST:-history}
      - OAUTH_DISCOVERY_URL=${OAUTH_DISCOVERY_URL}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      - ssl=${ssl:-false}
    build: ./nginx
    image: app-nginx:latest
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/ssl:/tmp/ssl:ro
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
