env OTEL_EXPORTER_OTLP_ENDPOINT;
env OTEL_SERVICE_NAME;
user root;
worker_processes  1;

error_log  /usr/local/openresty/nginx/logs/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 10000;
}

http {
    include       mime.types;

    default_type  application/octet-stream;

    real_ip_recursive on;
    real_ip_header X-Forwarded-For;
    # Set the CIDRs of the trusted proxy if you run your node behind one. Allowing all IPs is a security risk (attacker can spoof IPs by setting a random one in X-Forwarded-For).
    # Cloudflare CIDRs below: https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;

    log_format json_combined escape=json
      '{'
        '"time_local":"$time_local",'
        '"msec":"$msec",'
        '"remote_addr":"$remote_addr",'
        '"X-Forwarded-For":"$http_x_forwarded_for",'
        '"CF-Connecting-IP":"$http_cf_connecting_ip",'
        '"request_method":"$request_method",'
        '"request":"$request",'
        '"status": "$status",'
        '"request_time":"$request_time",'
        '"request_length":"$request_length",'
        '"bytes_sent":"$bytes_sent",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"http_user_agent":"$http_user_agent",'
        '"http_referrer":"$http_referer",'
        '"remote_user":"$remote_user",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"upstream_header_time":"$upstream_header_time"'
      '}';

    map $request_uri $loggable {
        default   1;
        /metrics  0;
        /_ping    0;
    }

    access_log  /usr/local/openresty/nginx/logs/access.log  json_combined if=$loggable;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;;";
    lua_shared_dict  discovery 1m;
    lua_shared_dict  jwks 1m;
    lua_shared_dict introspection 10m;
    lua_shared_dict csrf_tokens 10M;
    lua_shared_dict otel_spans 4M;
    init_worker_by_lua_block { require("tracing").init_worker() }
    init_by_lua_block {
      -- CSRF tokens for the app API, in this instance's shared dict; behind
      -- a load balancer, session stickiness keeps a browser on the instance
      -- that issued its token. Same module and policy as the node's nginx
      -- (nginx-packager/csrf.lua).
      csrf = require("csrf")
      csrf.init(ngx.shared.csrf_tokens)
    }

    log_by_lua_block { require("tracing").finish() }

    lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;         #TEMPLATE_MARK_SSL
    lua_ssl_verify_depth 5;                                                 #TEMPLATE_MARK_SSL

    client_body_buffer_size 64K;
    client_header_buffer_size 16k;
    client_max_body_size 4M;

    absolute_redirect off;

    # Exclude the docker network CIDR from rate limiting (e.g. for marketplace-backend calls to nginx)
    geo $bypass_limit {
      default   0;
      __DOCKER_NETWORK_CIDR__   1;
    }
    map $bypass_limit $limit_req_key {
        1   "";
        default   $binary_remote_addr;
    }

    limit_req_zone $limit_req_key zone=server:10m rate=80r/s; # E.g. allows 8 calls within 10ms
    limit_req_status 429;

    proxy_cache_path /tmp/nginx-cache levels=1:2 keys_zone=strato_short_term_cache:1m max_size=5m inactive=1s use_temp_path=off;

    upstream backend {
        server __BACKEND_HOST__:3001;
    }
    upstream ui {
        server __UI_HOST__:8080;
    }

    server {
      listen 80;
      listen 443 ssl;                                                       #TEMPLATE_MARK_SSL

      ssl_certificate    /etc/ssl/certs/server.pem;        #TEMPLATE_MARK_SSL
      ssl_certificate_key  /etc/ssl/private/server.key;                     #TEMPLATE_MARK_SSL
                                                                            #TEMPLATE_MARK_SSL
      # Restrict older SSL and TLS versions for better security             #TEMPLATE_MARK_SSL
      ssl_protocols TLSv1.2 TLSv1.3;                                        #TEMPLATE_MARK_SSL
                                                                            #TEMPLATE_MARK_SSL
      # Redirect http traffic to https, except internal calls to 'nginx'    #TEMPLATE_MARK_SSL
      set $RWHTTPS "";                                                      #TEMPLATE_MARK_SSL
      if ($ssl_protocol = "") {                                             #TEMPLATE_MARK_SSL
        set $RWHTTPS "Y";                                                   #TEMPLATE_MARK_SSL
      }                                                                     #TEMPLATE_MARK_SSL
      if ($host = "nginx") {                                                #TEMPLATE_MARK_SSL
        set $RWHTTPS "";                                                    #TEMPLATE_MARK_SSL
      }                                                                     #TEMPLATE_MARK_SSL
      if ($RWHTTPS = "Y") {                                                 #TEMPLATE_MARK_SSL
        rewrite ^ https://$host$request_uri? permanent;                     #TEMPLATE_MARK_SSL
      }                                                                     #TEMPLATE_MARK_SSL

      # Same cookie name as the node's nginx: the shared openid.lua detects
      # session rotation by that name.
      set $session_name   strato_session;
      # Sessions live in the (chunked, encrypted) cookie itself: with the shared
      # secret below any nginx instance can read a cookie minted by another,
      # so no server-side session store is needed.
      set $session_secret "__SESSION_SECRET__";                               #TEMPLATE_MARK_SESSION_SECRET
      set $ssl_session_tickets off;
      set $session_check_ssi off;
      set $session_cookie_persistent on;
      set $session_cookie_renew 600;
      set $session_cookie_lifetime 2592000;

      # The container's own nameservers (docker-run.sh fills this in from
      # /etc/resolv.conf): docker's embedded DNS under compose, the VPC
      # resolver on Fargate. Lua cosockets and variable proxy_pass targets
      # resolve through this directive, which ignores /etc/hosts, and nginx
      # queries listed servers round-robin, so a public server here made
      # every other lookup of a compose-internal name (local-auth, postgrest)
      # fail or hang for resolver_timeout.
      resolver __RESOLVER__ ipv6=off valid=30s;


      # Request tracing: continue the load balancer's or client's trace and

      # hand a W3C traceparent to every upstream (tracing.lua).

      set_by_lua_block $otel_traceparent { return require("tracing").start() }

      proxy_set_header traceparent $otel_traceparent;

      limit_req zone=server burst=100; # E.g. adds minor delays when exceeding 8 calls within 10ms

      large_client_header_buffers 4 16k;

      set $is_ui "false";
      set $allow_optional_anon_access "false";

      location /_ping {
        return 200 'pong';
      }

      location /auth/openidc/return {
        rewrite_by_lua_file  lua/openid.lua;
      }

      location /auth/logout {
        # Clear the CSRF token from the store AND the cookie on logout
        rewrite_by_lua_block {
          local session_id = csrf and csrf.get_session_id and csrf.get_session_id()
          if session_id and csrf.csrf_tokens then
            csrf.csrf_tokens:delete(session_id)
          end
          local clear_cookie = "CSRF-TOKEN=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT; SameSite=Strict"
          if ngx.var.https == "on" then
            clear_cookie = clear_cookie .. "; Secure"
          end
          ngx.header["Set-Cookie"] = clear_cookie
        }
        access_by_lua_file  lua/openid.lua;
      }
     
      location /login {
        set $is_ui "true";
        rewrite_by_lua_file  lua/openid.lua;
        header_filter_by_lua_block { csrf.handle_session_rotation() }
        access_by_lua_block {return ngx.redirect('/dashboard', 302)}
      }

      # Swagger UI routes - must come before / location  
      location ^~ /api-docs {
        set $is_ui "true";
        rewrite_by_lua_file lua/openid.lua;
        header_filter_by_lua_block { csrf.handle_session_rotation() }
        proxy_set_header traceparent $otel_traceparent;
        proxy_set_header Accept-Encoding "";
        proxy_pass http://backend$request_uri;
      }
     
      location / {
        set $is_ui "true";
        rewrite_by_lua_file lua/csrf.lua;
        header_filter_by_lua_block { csrf.handle_session_rotation() }
        proxy_set_header traceparent $otel_traceparent;
        proxy_set_header Accept-Encoding "";
        proxy_pass http://ui/;
      }
      
      location /vite-hmr {
        proxy_set_header traceparent $otel_traceparent;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_pass http://ui/vite-hmr;
      }

      location = /api/v1 {
        return 302 /api/v1/;
      }

      location /api/diagnostics {
        return 403;
      }
            
      # Unauthenticated metrics scrape, as on the node's nginx.
      location /api/metrics {
        proxy_set_header traceparent $otel_traceparent;
        proxy_set_header Accept-Encoding "";
        rewrite ^/api/metrics(.*)$ /api/v1/metrics$1 break;
        proxy_pass http://backend;
        client_max_body_size 1m;
      }

      # App history service (phase 7): anonymous, cacheable chart series.
      # Resolved at request time through a variable so nginx boots without
      # the service (a literal upstream would refuse to start).
      location /history-api/ {
        set $history_host "__HISTORY_HOST__";
        if ($history_host = "") { return 503; }
        proxy_set_header traceparent $otel_traceparent;
        proxy_set_header Host $host;
        proxy_pass http://$history_host:3030$request_uri;
      }

      location /api/ {
        rewrite_by_lua_file lua/csrf.lua;
        access_by_lua_file lua/openid.lua;
        header_filter_by_lua_block { csrf.handle_session_rotation() }
        set $allow_optional_anon_access "true";
        proxy_set_header traceparent $otel_traceparent;
        proxy_set_header Accept-Encoding "";
        proxy_pass http://backend$request_uri;
        client_max_body_size 1m;
      }

      # Payment-provider webhook: signed by the provider, no user session.
      location = /api/onramp/webhook {
        rewrite_by_lua_file lua/csrf.lua;
        header_filter_by_lua_block { csrf.handle_session_rotation() }
        proxy_set_header traceparent $otel_traceparent;
        proxy_set_header Accept-Encoding "";
        proxy_pass http://backend$request_uri;
        client_max_body_size 1m;
      }

      # Proxy JSON-RPC calls to the upstream STRATO node's /rpc endpoint.
      location /rpc {
        proxy_set_header traceparent $otel_traceparent;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_ssl_server_name on;
        proxy_pass __NODE_URL__/rpc;
      }

    }
}
