name:        strato-index
author:      Jamshid
copyright:   2016 Blockapps
description: Please see README.md
version:     0.1.0.0
license:     Apache-2.0

ghc-options: -threaded -rtsopts -with-rtsopts=-N

dependencies:
  - base

library:
  source-dirs: src/
  dependencies:
  - binary
  - blockapps-data
  - blockapps-datadefs
  - blockapps-mpdbs
  - blockDB
  - bytestring
  - common-log
  - containers
  - format
  - streaming
  - monad-alter
  - persistent-postgresql
  - seqevents
  - solid-vm-model
  - strato-conf
  - strato-model
  - strato-statediff
  - text
  - transformers
  - unliftio

executables:
  strato-indexer:
    main: ApiIndexerMain.hs
    source-dirs: exec_src
    dependencies:
      - blockapps-data
      - blockapps-init
      - blockDB
      - common-log
      - containers
      - hflags
      - monad-alter
      - process-monitor
      - redis-monad
      - sql-monad
      - strato-conf
      - strato-index
      - strato-model
      - streaming
    other-modules:
      - Wiring
