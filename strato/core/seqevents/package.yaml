name: seqevents
license: Apache-2.0

dependencies:
  - base
  - binary
  - blockapps-data
  - blockapps-datadefs

library:
  source-dirs: src/
  ghc-options: -fconstraint-solver-iterations=8
  dependencies:
    - aeson
    - base16-bytestring
    - blockDB
    - blockstanbul
    - bytestring
    - format
    - streaming
    - merkle-patricia-db
    - monad-alter
    - prometheus-client
    - strato-model
    - text

tests:
  seqevents-spec:
    source-dirs: test/
    main: EventSpec.hs
    ghc-options: -dynamic
    dependencies:
      - aeson
      - blockDB
      - bytestring
      - ethereum-rlp
      - hspec
      - seqevents
      - strato-model
      - text
      - QuickCheck
