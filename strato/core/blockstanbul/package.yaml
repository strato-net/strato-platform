name: blockstanbul
license: Apache-2.0

ghc-options: -Wall -Werror

dependencies:
  - base


library:
  source-dirs: src/
  dependencies:
  - QuickCheck
  - aeson
  - binary
  - blockapps-data
  - blockDB
  - bytestring
  - common-log
  - conduit
  - containers
  - cross-monitoring
  - cryptonite
  - data-default
  - deepseq
  - ethereum-rlp
  - extra
  - format
  - generic-arbitrary
  - hflags
  - lens
  - mtl
  - prometheus-client
  - solid-vm-model
  - strato-model
  - text
  - transformers
  - vault-monad

tests:
  blockstanbul-test:
    main: Main.hs
    source-dirs: test/
    ghc-options: -dynamic
    dependencies:
      - blockapps-data
      - blockstanbul
      - bytestring
      - common-log
      - conduit
      - containers
      - hflags
      - hspec
      - labeled-error
      - lens
      - mtl
      - strato-model
      - time
      - vault-monad


benchmarks:
  one-node:
    source-dirs: bench/
    main: OneNode.hs
    ghc-options: -dynamic
    dependencies:
      - blockstanbul
      - transformers
