name:                strato-ingest
version:             0.1.0.0
license:             Apache-2.0
synopsis:            "This core cell's transaction ingress: appends batches posted by the API tier to the local ingest log"

dependencies:
- base

executables:
  strato-ingest:
    main: Main.hs
    source-dirs: exec_src
    ghc-options: -Wall -Werror -threaded -rtsopts
    dependencies:
    - aeson
    - binary
    - blockapps-init
    - blockapps-data
    - blockDB
    - common-log
    - composable-monads-base
    - containers
    - hflags
    - http-types
    - process-monitor
    - prometheus-client
    - seqevents
    - strato-conf
    - strato-model
    - strato-tracing
    - streaming
    - text
    - unliftio
    - wai
    - wai-middleware-prometheus
    - warp
