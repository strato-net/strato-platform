name: vm-tools
version: 0.0.4
build-type: Simple
author: Jamshid
maintainer:    jamshidnh@gmail.com
synopsis: types and tools needed to write a VM for Strato
category:      Data Structures
license: Apache-2.0

dependencies:
  - base
  - hflags

library:
  source-dirs: src/
  exposed-modules:
    - Blockchain.Bagger
    - Blockchain.Bagger.BaggerState
    - Blockchain.Bagger.Transactions
    - Blockchain.Data.BlockSummary
    - Blockchain.Data.VmTrace
    - Blockchain.Data.ExecResults
    - Blockchain.DB.BlockSummaryDB
    - Blockchain.DB.ModifyStateDB
    - Blockchain.Forks
    - Blockchain.StateRootMismatch
    - Blockchain.Stream.Action
    - Blockchain.Stream.VMEvent
    - Blockchain.Timing
    - Blockchain.TxRunResultCache
    - Blockchain.VMContext
    - Blockchain.VMOptions
    - Blockchain.VM.VMException
    - Blockchain.VMMetrics
    - Blockchain.Wiring
    - Executable.EVMFlags
  ghc-options: -Wall -O2 -fexpose-all-unfoldings -fspecialise-aggressively
  dependencies:
    - aeson
    - binary
    - binary-instances
    - blockapps-data
    - blockapps-datadefs
    - blockapps-init
    - blockapps-mpdbs
    - blockDB
    - blockstanbul
    - bytestring
    - common-log
    - composable-monads-base
    - containers
    - cross-monitoring
    - data-default
    - debugger
    - deepseq
    - directory
    - dlist
    - ethereum-rlp
    - exceptions
    - extra
    - format
    - hedis
    - streaming
    - lens
    - leveldb-haskell
    - lrucache
    - accountdb-monad
    - statedb-monad
    - monad-alter
    - mtl
    - nibblestring
    - ordered-containers
    - prometheus-client
    - quickcheck-instances
    - redis-monad
    - resourcet
    - seqevents
    - solid-vm-model
    - store
    - strato-conf
    - strato-model
    - strato-statediff
    - text
    - time
    - transformers
    - unordered-containers
    - unliftio



tests:
  contextm-test:
    source-dirs: test/
    main: Spec.hs
    ghc-options: -Wall -O2 -dynamic
    dependencies:
      - hspec
      - QuickCheck
      - blockapps-data
      - blockDB
      - containers
      - ethereum-rlp
      - strato-model
      - vm-tools
      - strato-conf
      - base16-bytestring
      - blockapps-data
      - blockapps-datadefs
      - blockDB
      - bytestring
      - containers
      - ethereum-rlp
      - statedb-monad
      - solid-vm-model
      - strato-model
      - time
      - vector
      - Decimal
      - binary
      - ordered-containers
      - quickcheck-instances
      - text
