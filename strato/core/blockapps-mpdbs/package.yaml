name: blockapps-mpdbs
version: 0.0.1
build-type: Simple
author: Jamshid
maintainer: jamshidnh@gmail.com
synopsis: A Haskell version of an Ethereum client
category: Data Structures
description: The client described in the Ethereum Yellowpaper
license: Apache-2.0

dependencies:
  - base



ghc-options: -Wall -O2

library:
  source-dirs: src/
  default-extensions: TemplateHaskell
  dependencies:
  - base16-bytestring
  - binary
  - bytestring
  - common-log
  - containers
  - data-default
  - deepseq
  - ethereum-rlp
  - fastMP
  - format
  - leveldb-haskell
  - merkle-patricia-db
  - monad-alter
  - monad-loops
  - nibblestring
  - solid-vm-model
  - strato-model
  - transformers
  - unliftio-core
  - monad-logger
  - unordered-containers
  - hashable

tests:
  blockapps-mpdbs-test:
    source-dirs: test/
    main: Main.hs
    # StorageSpec is excluded: it no longer compiles against the current
    # model (Blockchain.Strato.Model.Account / BAccount are gone).
    other-modules:
      - GenerationalCacheSpec
    dependencies:
      - blockapps-mpdbs
      - blockapps-data
      - bytestring
      - common-log
      - containers
      - directory
      - hspec
      - hspec-expectations-lifted
      - lens
      - leveldb-haskell
      - merkle-patricia-db
      - monad-alter
      - nibblestring
      - resourcet
      - solid-vm-model
      - strato-model
      - transformers
      - unix
      - unliftio
    ghc-options: -Wall -Werror -threaded -rtsopts -with-rtsopts=-N -dynamic
