name:                strato-model
version:             0.1.0.0
author:              BlockApps
maintainer:          blockapps
build-type:          Simple
license:             Apache-2.0

dependencies:
  - base
  - blockapps-haskoin
  - bytestring




ghc-options: -Wall -Werror -fno-warn-warnings-deprecations

library:
  source-dirs: src
  default-extensions:
    - MultiParamTypeClasses
    - FlexibleContexts
    - FlexibleInstances
    - GeneralizedNewtypeDeriving
    - GADTs
    - RecordWildCards
    - FunctionalDependencies
  dependencies:
    - QuickCheck
    - aeson
    - asn1-types
    - base16-bytestring
    - binary
    - bytestring-arbitrary
    - containers
    - cpu
    - crypton
    - data-default
    - deepseq
    - ethereum-rlp
    - fast-keccak256
    - format
    - generic-arbitrary
    - hashable
    - hflags
    - http-api-data
    - integer-gmp
    - iproute
    - labeled-error
    - lens
    - memory
    - mtl
    - nibblestring
    - quickcheck-instances
    - path-pieces
    - persistent
    - persistent-postgresql
    - primitive
    - blockapps-secp256k1-haskell
    - servant
    - servant-docs
    - servant-server
    - openapi3
    - text
    - time

tests:
  strato-model-tests:
    source-dirs: test/
    main: Spec.hs
    ghc-options: -dynamic # this flag is the result of two weeks I spent trying to link secp256k1_ecdh
    dependencies:
      - aeson
      - aeson-qq
      - binary
      - ethereum-rlp
      - labeled-error
      - persistent
      - Ranged-sets
      - strato-model
      - text
      - hspec
      - QuickCheck
      - containers


benchmarks:
  word256:
    source-dirs: bench/
    ghc-options: -dynamic
    main: Word256Bench.hs
    dependencies:
      - strato-model
      - criterion


