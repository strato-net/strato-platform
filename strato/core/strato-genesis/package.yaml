name: strato-genesis
version: 0.0.1
build-type: Simple
author: Jamshid
maintainer:    jamshidnh@gmail.com
synopsis: A tool to setup the DBs for a Strato instance
category:      Data Structures
description: A tool to setup the DBs for a Strato instance
license: Apache-2.0

dependencies:
  - base

library:
    source-dirs: src/
    ghc-options: -Wall -O2
    dependencies:
      - base16-bytestring
      - blockapps-data
      - blockapps-mpdbs
      - common-log
      - containers
      - crypto-api
      - data-default
      - file-embed
      - filepath
      - format
      - json-stream
      - labeled-error
      - monad-alter
      - time
      - vector
      - aeson
      - bytestring
      - merkle-patricia-db
      - strato-model
      - text
      - solid-vm-compiler
      - solid-vm-model
      - ethereum-rlp
      - template-haskell
      - vm-tools

tests:
  strato-genesis-test:
    source-dirs: test
    main: Main.hs
    dependencies:
      - aeson
      - blockapps-data
      - bytestring
      - containers
      - hspec
      - json-stream
      - labeled-error
      - merkle-patricia-db
      - strato-genesis
      - strato-model
      - text
      - time
      - vector
    ghc-options: -Wall -dynamic
