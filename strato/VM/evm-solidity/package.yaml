name: evm-solidity
version: 0.1.0.0
synopsis: Solidity datatypes
description: Solidity datatypes
author: Eitan Chatav
maintainer: eitan@blockapps.net
copyright: 2016 BlockApps
category: Web
build-type: Simple
license: Apache-2.0

ghc-options: -Wall -Werror

dependencies:
  - base
  - aeson
  - base16-bytestring
  - bimap
  - bytestring
  - containers
  - Decimal
  - ordered-containers
  - parsec
  - QuickCheck
  - scientific
  - solid-vm-model
  - strato-model
  - text
  - unordered-containers
  - vector

library:
  source-dirs: src/
  dependencies:
  - aeson-casing
  - binary
  - cryptonite
  - deepseq
  - extra
  - generic-random
  - hashable
  - lens
  - memory
  - mtl
  - quickcheck-instances
  - semver-range
  - openapi3


# NOTE: the legacy test/Main.hs (using hspec-discover over
# test/BlockApps/...) is left in place but not wired up — those specs
# were commented out years ago and reviving them is out of scope for
# the audit follow-up. The active test suite below has its own entry
# point and only loads the audit-fix regression specs.
tests:
  audit-fix-spec:
    main: AuditFixMain.hs
    source-dirs: test/
    other-modules:
      - BlockApps.Solidity.ABI.CodecAuditFixSpec
    dependencies:
      - bytestring
      - evm-solidity
      - hspec
      - solid-vm-model
      - vector
