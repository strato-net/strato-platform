name: solid-vm
license: Apache-2.0
build-type: Custom

extra-source-files:
  - native/Cargo.lock
  - native/Cargo.toml
  - native/rust-toolchain.toml
  - native/src/lib.rs

flags:
  native-bn254:
    description: Build the optional accelerated BN254 backend (requires Cargo)
    manual: true
    default: false

custom-setup:
  dependencies:
    - base
    - Cabal
    - directory
    - filepath
    - process

dependencies:
  - base

library:
  source-dirs: src/
  when:
    - condition: flag(native-bn254)
      cpp-options: -DSOLIDVM_NATIVE_BN254
      extra-libraries:
        - Csolid_vm_native
      extra-bundled-libraries:
        - Csolid_vm_native
      other-modules:
        - Blockchain.SolidVM.Native
  exposed-modules:
    - Blockchain.SolidVM
    - Blockchain.SolidVM.Builtins
    - Blockchain.SolidVM.Environment
    - Blockchain.SolidVM.GasInfo
    - Blockchain.SolidVM.Simple
    - Blockchain.SolidVM.SM
    - Blockchain.SolidVM.FastUIntIR
    - Blockchain.SolidVM.IREval
    # BLS12-381 internal modules. Exposed so the test target (and anyone
    # cross-checking against RFC 9380 vectors) can drive the pipeline
    # stages directly. Stable public API for bridge contracts is via the
    # byte builtins re-exported from Builtins.
    - Blockchain.SolidVM.BLS12381
    - Blockchain.SolidVM.BLS12381.Compress
    - Blockchain.SolidVM.BLS12381.HashToCurve
    - Blockchain.SolidVM.BLS12381.HashToCurve.G1
    - Blockchain.SolidVM.BLS12381.HashToCurve.G2
    - Blockchain.SolidVM.BLS12381.HashToCurve.HashToField
  ghc-options: -Wall -O2 -fexpose-all-unfoldings -fspecialise-aggressively -fdicts-cheap -fsolve-constant-dicts
  dependencies:
  - base16-bytestring
  - base64-bytestring
  - blockapps-data
  - blockapps-datadefs
  - blockapps-haskoin
  - blockapps-mpdbs
  - bytestring
  - common-log
  - containers
  - cryptohash
  - crypton
  - data-default
  - debugger
  - Decimal
  - deepseq
  - elliptic-curve
  - ethereum-rlp
  - evm-solidity
  - exceptions
  - format
  - lens
  - memory
  - merkle-patricia-db
  - monad-alter
  - nibblestring
  - ordered-containers
  - pairing
  - parsec
  - poseidon-hash
  - solid-vm-compiler
  - solid-vm-model
  - solid-vm-parser
  - solid-vm-static-analysis
  - source-tools
  - strato-conf
  - strato-model
  - text
  - time
  - transformers
  - unordered-containers
  - unliftio
  - utf8-string
  - vector
  - vm-tools
  - ordered-containers



executables:
  exprs-needed:
    source-dirs: exec_src
    other-modules: []
    main: ExprsNeeded.hs
    dependencies:
      - containers
      - parsec
      - solid-vm-model
      - solid-vm-parser
      - solid-vm-static-analysis
      - text

tests:
  solid-vm-spec:
    source-dirs: tests/
    main: Main.hs
    ghc-options: -dynamic
    dependencies:
      - QuickCheck
      - aeson
      - async
      - base16-bytestring
      - blockapps-data
      - blockapps-datadefs
      - blockapps-mpdbs
      - blockDB
      - bytestring
      - common-log
      - composable-monads-base
      - containers
      - crypto-api
      - elliptic-curve
      - ethereum-rlp
      - extra
      - hflags
      - hspec
      - hspec-expectations-lifted
      - labeled-error
      - lens
      - merkle-patricia-db
      - monad-alter
      - pairing
      - raw-strings-qq
      - seqevents
      - solid-vm
      - solid-vm-compiler
      - solid-vm-model
      - solid-vm-parser
      - solid-vm-static-analysis
      - source-tools
      - strato-genesis
      - strato-init
      - strato-model
      - strato-redis-blockdb
      - text
      - time
      - transformers
      - unliftio
      - utf8-string
      - vm-tools
      - ordered-containers

benchmarks:
    codebench:
      source-dirs: bench/
      main: CodeBench.hs
      ghc-options: -dynamic
      dependencies:
        - file-embed
        - solid-vm
        - deepseq
        - criterion
        - binary
        - memory
        - bytestring
        - containers
        - text
        - parsec
        - strato-model
        - solid-vm-compiler
        - solid-vm-parser
        - solid-vm-static-analysis
        - solid-vm-model
        - lens
        - common-log
        - vm-tools
        - hflags
