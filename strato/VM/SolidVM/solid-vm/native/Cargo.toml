[package]
name = "solid-vm-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
ark-bn254 = { version = "=0.5.0", default-features = false, features = ["curve", "std"] }
ark-ec = { version = "=0.5.0", default-features = false, features = ["std"] }
ark-ff = { version = "=0.5.0", default-features = false, features = ["asm", "std"] }
ark-serialize = { version = "=0.5.0", default-features = false, features = ["std"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
