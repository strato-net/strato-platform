name: solid-vm-parser
license: Apache-2.0

dependencies:
  - base

library:
  source-dirs: src/
  exposed-modules:
    - SolidVM.Solidity.Parse.File
    - SolidVM.Solidity.Parse.Lexer
    - SolidVM.Solidity.Parse.Statement
    - SolidVM.Solidity.Parse.Pragmas
    - SolidVM.Solidity.Parse.ParserTypes
    - SolidVM.Solidity.Parse.UnParser
    - SolidVM.Solidity.Parse.Declarations
    - SolidVM.Solidity.Parse.Fast.Lexer
    - SolidVM.Solidity.Parse.Fast.Monad
    - SolidVM.Solidity.Parse.Fast.Types
    - SolidVM.Solidity.Parse.Fast.Expression
    - SolidVM.Solidity.Parse.Fast.Statement
    - SolidVM.Solidity.Parse.Fast.Declarations
    - SolidVM.Solidity.Parse.Fast.File
    - SolidVM.Solidity.Parse.Fast.Parser
    - SolidVM.Solidity.Xabi
  ghc-options: -Wall -O2
  dependencies:
  - aeson
  - aeson-casing
  - bytestring
  - containers
  - Decimal
  - extra
  - lens
  - parsec
  - QuickCheck
  - quickcheck-instances
  - semver-range
  - solid-vm-model
  - source-tools
  - strato-model
  - openapi3
  - text
  - vector
  - deepseq


executables:
  parse-solidvm:
    source-dirs: exec_src
    other-modules: []
    main: Parse.hs
    dependencies:
      - containers
      - parsec
      - solid-vm-parser
    ghc-options: -Wall -O2 -threaded -rtsopts

tests:
  solid-vm-spec:
    source-dirs: tests/
    main: Main.hs
    ghc-options: -dynamic
    dependencies:
      - hflags
      - hspec
      - HUnit
      - parsec
      - raw-strings-qq
      - solid-vm-model
      - solid-vm-parser
      - source-tools
      - strato-model
      - text
      - vm-tools
