name: solid-vm-compiler
license: Apache-2.0

dependencies:
  - base

library:
  source-dirs: src/
  exposed-modules:
    - Blockchain.SolidVM.CodeCollectionDB
    - Blockchain.SolidVM.ImportResolver
    - Blockchain.SolidVM.Metrics
    - SolidVM.CodeCollectionTools
  ghc-options: -Wall -O2
  dependencies:
  - aeson
  - blockapps-mpdbs
  - bytestring
  - containers
  - data-default
  - deepseq
  - lens
  - lrucache
  - monad-alter
  - parsec
  - prometheus-client
  - solid-vm-model
  - solid-vm-parser
  - solid-vm-static-analysis
  - source-tools
  - strato-model
  - text
  - transformers

tests:
  audit-fix-spec:
    main: AuditFixMain.hs
    source-dirs: tests/
    other-modules:
      - ImportResolverAuditFixSpec
    dependencies:
      - aeson
      - blockapps-mpdbs
      - bytestring
      - containers
      - data-default
      - hspec
      - lens
      - lrucache
      - monad-alter
      - mtl
      - solid-vm-compiler
      - solid-vm-model
      - solid-vm-parser
      - source-tools
      - strato-model
      - text
      - transformers
