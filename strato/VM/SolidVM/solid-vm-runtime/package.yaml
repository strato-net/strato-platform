name: solid-vm-runtime
license: Apache-2.0

dependencies:
  - base

library:
  source-dirs: src/
  ghc-options: -Wall -O2 -fexpose-all-unfoldings -fspecialise-aggressively -fdicts-cheap -fsolve-constant-dicts
  dependencies:
    - accountdb-monad
    - blockapps-data
    - blockapps-datadefs
    - blockapps-mpdbs
    - bytestring
    - common-log
    - composable-monads-base
    - containers
    - debugger
    - deepseq
    - exceptions
    - format
    - lens
    - monad-alter
    - nibblestring
    - ordered-containers
    - solid-vm-builtins
    - solid-vm-compiler
    - solid-vm-model
    - solid-vm-parser
    - source-tools
    - statedb-monad
    - strato-conf
    - strato-model
    - text
    - transformers
    - unliftio
    - vm-tools
