name: solid-vm-builtins
license: Apache-2.0

dependencies:
  - base

library:
  source-dirs: src/
  ghc-options: -Wall -O2 -fexpose-all-unfoldings -fspecialise-aggressively
  dependencies:
    - base16-bytestring
    - base64-bytestring
    - blockapps-data
    - blockapps-mpdbs
    - blockapps-secp256k1-haskell
    - bytestring
    - common-log
    - containers
    - cryptohash
    - crypton
    - Decimal
    - elliptic-curve
    - ethereum-rlp
    - memory
    - monad-alter
    - pairing
    - poseidon-hash
    - solid-vm-model
    - solid-vm-runtime
    - strato-model
    - text
    - time
    - vector
    - vm-tools

tests:
  solid-vm-builtins-spec:
    source-dirs: test/
    main: Main.hs
    dependencies:
      - solid-vm-builtins
      - blockapps-data
      - blockapps-mpdbs
      - common-log
      - composable-monads-base
      - containers
      - data-default
      - hflags
      - monad-alter
      - vm-tools
      - base16-bytestring
      - bytestring
      - Decimal
      - elliptic-curve
      - hspec
      - pairing
      - solid-vm-model
      - solid-vm-runtime
      - strato-model
      - text
      - time
      - transformers
      - vector
