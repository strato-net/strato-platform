name:                ethereum-jsonrpc
version:             0.1.0.0
synopsis:            Initial project template from stack
description:         Please see README.md
category:            Web
build-type:          Simple

executables:
  ethereum-jsonrpc:
    source-dirs:      src
    main:             Main.hs
    # Must be -threaded. The non-threaded RTS uses select() for its I/O manager,
    # which aborts once any file descriptor >= 1024 (FD_SETSIZE) is opened
    # ("file descriptor 1024 out of range for select"). The threaded RTS uses the
    # epoll/kqueue event manager and has no such limit.
    ghc-options:      -threaded -rtsopts -with-rtsopts=-N
    dependencies:
      - base
      - aeson
      - base16-bytestring
      - binary
      - blaze-builder
      - blockapps-data
      - blockapps-datadefs
      - strato-version
      - blockDB
      - core-api2
      - bytestring
      - case-insensitive
      - codedb-monad
      - containers
      - ethereum-rlp
      - evm-solidity
      - solid-vm-model
      - format
      - http-client
      - http-types
      - json-rpc-server
      - streaming
      - milena
      - mtl
      - seqevents
      - servant-client
      - strato-conf
      - strato-model
      - strato-p2p
      - text
      - time
      - wai
      - warp
