#strato-getting-started-min-version:4.2.1
version: "3"
volumes:
  vaultpgdata:
    driver: local
  idpconfig:
      driver: local
services:
  vault-wrapper:
    depends_on:
      pg-init:
        condition: service_completed_successfully
        required: false
    environment:
    - keyStoreCacheTimeout=${keyStoreCacheTimeout:-60}
    - postgres_host=${postgres_host:-postgres}
    - postgres_password=${postgres_vault_password:?postgres_vault_password is required}
    - postgres_port=5432
    - postgres_user=${postgres_vault_user:-strato_vault}
    - postgres_vault_wrapper_db=${postgres_vault_wrapper_db:-oauth}
    - VAULTWRAPPER_DEBUG=${VAULTWRAPPER_DEBUG}
    image: ${VAULTWRAPPER_IMAGE:-registry-aws.blockapps.net:5000/blockapps/vault-wrapper:14.5.2-e324a42}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
  # The bundled database and its provisioning run only under the "postgres"
  # profile. Without it the Vault connects to an external database as
  # postgres_vault_user, a login that database's operator manages.
  pg-init:
    profiles: ["postgres"]
    image: postgres:9.6
    entrypoint: ["/pg-init.sh"]
    environment:
      - postgres_host=${postgres_host:-postgres}
      - postgres_port=5432
      - postgres_admin_user=${postgres_user:-postgres}
      - postgres_admin_password=${postgres_password:-}
      - postgres_vault_password=${postgres_vault_password:?postgres_vault_password is required}
      - postgres_vault_wrapper_db=${postgres_vault_wrapper_db:-oauth}
    volumes:
      - ../pg-init.sh:/pg-init.sh:ro
    depends_on:
      - postgres
    restart: "no"
  postgres:
    profiles: ["postgres"]
    environment:
      - POSTGRES_PASSWORD=${postgres_password:-}
    image: postgres:9.6
    volumes:
      - vaultpgdata:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=512MB"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
  nginx:
    depends_on:
    - vault-wrapper
    environment:
    - INITIAL_OAUTH_DISCOVERY_URL=${INITIAL_OAUTH_DISCOVERY_URL}
    - INITIAL_OAUTH_ISSUER=${INITIAL_OAUTH_ISSUER}
    - INITIAL_OAUTH_JWT_USER_ID_CLAIM=${INITIAL_OAUTH_JWT_USER_ID_CLAIM}
    - ssl=${ssl}
    - sslCertFileType=${sslCertFileType}
    - VAULT_WRAPPER_HOST=${VAULT_WRAPPER_HOST}
    image: ${VAULTNGINX_IMAGE:-registry-aws.blockapps.net:5000/blockapps/vault-nginx:14.5.2-e324a42}
    ports:
    - ${HTTP_PORT:-8090}:80 #TAG_REMOVE_WHEN_SSL_CUSTOM_HTTPS_PORT
    - ${HTTPS_PORT:-8093}:443 #TAG_REMOVE_WHEN_NO_SSL
    volumes:
    - ./ssl:/tmp/ssl:ro
    - idpconfig:/config
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
