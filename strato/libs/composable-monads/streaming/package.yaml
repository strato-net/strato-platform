name:                streaming
version:             0.1.0.0
license:             Apache-2.0

# Umbrella package for message streaming.
# To switch backends, change THREE things:
#   1. The dependency below
#   2. The import in Streaming.hs
#   3. The import in DockerConfig.hs
#
# Available backends:
#   kafka-monad        - Kafka via Milena (pure Haskell)
#   streaming-kafka-hw - Redpanda via hw-kafka-client (librdkafka)
#   streaming-rabbitmq - RabbitMQ via amqp

dependencies:
- base >= 4.7 && < 5
- streaming-jlog  # <- change this line to switch backends

library:
  source-dirs: src
  exposed-modules:
  - Control.Monad.Composable.Streaming
  - Control.Monad.Composable.Streaming.DockerConfig
