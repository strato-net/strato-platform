site_name: Docs
site_description: STRATO platform technical documentation (use-case first, end-user + developer)
site_url: https://docs.strato.nexus
site_author: BlockApps
copyright: Copyright &copy; 2026 BlockApps - STRATO Platform

theme:
  name: material
  custom_dir: techdocs-overrides
  logo: assets/strato-logo.svg
  favicon: assets/favicon.png
  font:
    text: Poppins
    code: Geist Mono
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.expand
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.action.view
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: lucide/moon
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/telegram
      link: https://t.me/strato_net
      name: Telegram Community
    - icon: fontawesome/solid/circle-question
      link: https://support.blockapps.net
      name: Support Portal
    - icon: fontawesome/solid/book
      link: https://docs.strato.nexus
      name: Documentation

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
      fallback_to_build_date: true
      enable_git_follow: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3

docs_dir: techdocs

